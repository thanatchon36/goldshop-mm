name: Bug report
description: Something behaves wrong in paper, testnet, live or backtest
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Never paste API keys, secrets, Telegram tokens or account IDs.** Redact log lines before posting."
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [tests / backtest, paper, testnet, live]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Observed vs expected. Include the symbol and whether quoting was paused, stale or halted.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: The relevant JSON log lines (UTC timestamps).
      render: json
  - type: input
    id: commit
    attributes:
      label: Commit
      placeholder: git rev-parse --short HEAD
